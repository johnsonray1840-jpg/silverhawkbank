<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: false }" x-init="darkMode = localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)" :class="{ 'dark': darkMode }">
<head>
    <title>Verify Email & 2FA — Silverhawk</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="storage/app/public/photos/tNFUE3sGZGbamIg8jLS8E0F8tIgI1ByGmVMWxouN.png">
    
    <!-- Dark mode initialization -->
    <script>
        const isDarkMode = localStorage.getItem('darkMode') === 'true' || 
                          (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDarkMode) {
            document.documentElement.classList.add('dark');
        }
    </script>
    
    <!-- Tailwind CSS with custom color variables -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            DEFAULT: '#0ea5e9',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            foreground: '#ffffff',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aquawolf04/font-awesome-pro@5cd1511/css/all.css">
    
    <!-- External Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .font-mono {
            font-family: "JetBrains Mono", monospace;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-center items-center p-4 antialiased selection:bg-primary-500 selection:text-white">

    <!-- Top Floating Logo -->
    <div class="mb-8 text-center">
        <a href="index.html" class="inline-flex items-center space-x-3 group">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-primary-600 to-indigo-600 p-0.5 shadow-xl group-hover:scale-105 transition-transform">
                <div class="w-full h-full bg-white dark:bg-gray-900 rounded-[14px] flex items-center justify-center">
                    <i class="fas fa-university text-primary-500 text-xl"></i>
                </div>
            </div>
            <div class="text-left">
                <span class="text-2xl font-black tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 dark:from-white dark:to-gray-300 bg-clip-text text-transparent">Silverhawk</span>
                <span class="block text-[10px] font-semibold uppercase tracking-wider text-primary-600 dark:text-primary-400">Institutional Digital Banking</span>
            </div>
        </a>
    </div>

    <!-- Verification Card Container -->
    <div class="max-w-md w-full bg-white dark:bg-gray-800 border border-gray-200/80 dark:border-gray-700/80 rounded-3xl shadow-2xl overflow-hidden p-8 space-y-6">
        
        <!-- Header & Icon -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-primary-50 dark:bg-primary-950/60 border border-primary-200/50 text-primary-600 dark:text-primary-400 flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fas fa-shield-check"></i>
            </div>
            <h1 class="text-xl font-black tracking-tight text-gray-900 dark:text-white" id="verify-title">Verify 6-Digit Security Code</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400" id="verify-subtitle">
                A 6-digit confirmation code has been dispatched to your email address via Resend.
            </p>
        </div>

        <!-- Verification Form -->
        <form id="otp-verify-form" class="space-y-5">
            <!-- Target Email Display (Read-Only) -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300">Recipient Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-envelope text-sm"></i>
                    </div>
                    <input 
                        type="email" 
                        id="verify-email-input" 
                        name="email" 
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl text-xs font-medium text-gray-700 dark:text-gray-300 focus:outline-none" 
                        placeholder="you@domain.com"
                        required>
                </div>
            </div>

            <!-- 6-Digit Code Input -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300">Enter 6-Digit Verification Code</label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="verify-code-input" 
                        name="code" 
                        maxlength="6" 
                        class="w-full py-3.5 px-4 bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-2xl text-center text-2xl font-mono font-bold tracking-[0.5em] text-primary-600 dark:text-primary-400 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" 
                        placeholder="••••••" 
                        autocomplete="one-time-code"
                        autofocus 
                        required>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="verify-submit-btn" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-primary-600 to-indigo-600 hover:from-primary-500 hover:to-indigo-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-primary-500/25 transition-all flex items-center justify-center space-x-2">
                <i class="fas fa-lock-open-alt"></i>
                <span>Verify &amp; Continue to Dashboard</span>
            </button>
        </form>

        <!-- Resend Code Actions -->
        <div class="pt-2 text-center border-t border-gray-100 dark:border-gray-700/60 flex items-center justify-between text-xs">
            <span class="text-gray-500">Didn't receive the email?</span>
            <button 
                type="button" 
                id="resend-code-btn" 
                class="font-bold text-primary-600 dark:text-primary-400 hover:underline flex items-center space-x-1">
                <i class="fas fa-redo-alt text-[10px]"></i>
                <span>Resend Code</span>
            </button>
        </div>

        <!-- Back to Login Link -->
        <div class="text-center pt-2">
            <a href="login.html" class="text-xs text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                <i class="fas fa-arrow-left mr-1"></i> Return to Sign In
            </a>
        </div>
    </div>

    <!-- API Client & UI Bridge -->
    <script src="/temp/js/silverhawk-api.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get('email') || sessionStorage.getItem('pending_verification_email') || '';
            const typeParam = urlParams.get('type') || 'EMAIL_VERIFICATION';

            const emailInput = document.getElementById('verify-email-input');
            const codeInput = document.getElementById('verify-code-input');
            const form = document.getElementById('otp-verify-form');
            const resendBtn = document.getElementById('resend-code-btn');
            const submitBtn = document.getElementById('verify-submit-btn');

            if (emailParam) {
                emailInput.value = emailParam;
            }

            // Only allow numbers in 6-digit input
            codeInput.addEventListener('input', (e) => {
                codeInput.value = codeInput.value.replace(/[^0-9]/g, '').slice(0, 6);
                if (codeInput.value.length === 6) {
                    // Auto-submit on 6 digits
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // Handle Form Submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const code = codeInput.value.trim();

                if (!email || !code) {
                    window.SilverhawkToast('Please enter both your email and the 6-digit code', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Verifying Code...';

                try {
                    const res = await window.SilverhawkAPI.verifyOtp(email, code, typeParam);
                    window.SilverhawkToast('Verification successful! Redirecting to your Dashboard...', 'success');
                    sessionStorage.removeItem('pending_verification_email');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 800);
                } catch (err) {
                    window.SilverhawkToast(err.message || 'Invalid or expired verification code', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-lock-open-alt mr-2"></i> Verify &amp; Continue to Dashboard';
                }
            });

            // Handle Resend Code
            resendBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                if (!email) {
                    window.SilverhawkToast('Please enter your email address first', 'error');
                    return;
                }

                resendBtn.disabled = true;
                resendBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Sending...';

                try {
                    await window.SilverhawkAPI.resendOtp(email, typeParam);
                    window.SilverhawkToast('A fresh 6-digit code has been dispatched to your email!', 'success');
                    
                    let countdown = 30;
                    const timer = setInterval(() => {
                        resendBtn.innerHTML = `Wait ${countdown}s`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(timer);
                            resendBtn.disabled = false;
                            resendBtn.innerHTML = '<i class="fas fa-redo-alt text-[10px] mr-1"></i> Resend Code';
                        }
                    }, 1000);
                } catch (err) {
                    window.SilverhawkToast(err.message || 'Failed to resend code', 'error');
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = '<i class="fas fa-redo-alt text-[10px] mr-1"></i> Resend Code';
                }
            });
        });
    </script>
</body>
</html>
