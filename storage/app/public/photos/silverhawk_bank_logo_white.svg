<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 252" width="100%" height="100%" fill="none">
  <!-- CLASSICAL BANK BUILDING EMBLEM -->
  <g fill="#ffffff">
    <!-- Pediment Roof (Triangle) -->
    <path d="M126 36 L36 94 L216 94 Z"/>
    
    <!-- Architrave / Roof Base Beam -->
    <rect x="28" y="102" width="196" height="18" rx="3"/>
    
    <!-- 3 Greek Columns / Pillars with Base and Capital Details -->
    <!-- Left Column -->
    <rect x="48" y="126" width="30" height="70" rx="3"/>
    <rect x="44" y="123" width="38" height="7" rx="2"/>
    <rect x="44" y="192" width="38" height="7" rx="2"/>

    <!-- Middle Column -->
    <rect x="111" y="126" width="30" height="70" rx="3"/>
    <rect x="107" y="123" width="38" height="7" rx="2"/>
    <rect x="107" y="192" width="38" height="7" rx="2"/>

    <!-- Right Column -->
    <rect x="174" y="126" width="30" height="70" rx="3"/>
    <rect x="170" y="123" width="38" height="7" rx="2"/>
    <rect x="170" y="192" width="38" height="7" rx="2"/>

    <!-- Foundation Steps (Plinth) -->
    <rect x="36" y="202" width="180" height="12" rx="2"/>
    <rect x="24" y="218" width="204" height="14" rx="4"/>
  </g>

  <!-- BOLD COMMANDING TYPOGRAPHY: SilverhawkBank -->
  <text x="270" y="174" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="132" 
        letter-spacing="-1.5" 
        fill="#ffffff">
    SilverhawkBank
  </text>
</svg>

